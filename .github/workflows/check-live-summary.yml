name: deploy-and-check-live-summary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-and-check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "CLOUDFLARE_API_TOKEN or CF_API_TOKEN is not configured"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "CLOUDFLARE_ACCOUNT_ID or CF_ACCOUNT_ID is not configured"; exit 1; }
      - name: Deploy Worker and static assets
        shell: bash
        run: |
          cp wrangler.jsonc.example wrangler.jsonc
          pnpm exec wrangler deploy --config wrangler.jsonc
      - name: Check deployed HTML and summary assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://tokyo-budget-execution-2026.matsuxr.workers.dev"
          for attempt in {1..15}; do
            html="$(curl --fail --silent --show-error --max-time 20 "$base/" || true)"
            module="$(curl --fail --silent --show-error --max-time 20 "$base/top-unused-summary.js" || true)"
            css="$(curl --fail --silent --show-error --max-time 20 "$base/top-unused-summary.css" || true)"
            if grep -q '/top-unused-summary.css' <<<"$html" \
              && grep -q '未執行額が大きい注目6項目' <<<"$module" \
              && grep -q '中小河川整備費' <<<"$module" \
              && grep -q '高潮防御施設費' <<<"$module" \
              && grep -q '生活支援費' <<<"$module" \
              && grep -q '.top-unused-summary-list' <<<"$css"; then
              echo "Live deployment contains the six-item summary assets."
              exit 0
            fi
            sleep 5
          done
          echo "Live deployment did not expose the new summary assets."
          exit 1
