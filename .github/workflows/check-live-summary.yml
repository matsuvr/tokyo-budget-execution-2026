name: check-live-summary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed HTML and summary assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://tokyo-budget-execution-2026.matsuxr.workers.dev"
          for attempt in {1..15}; do
            html="$(curl --fail --silent --show-error --max-time 20 "$base/" || true)"
            module="$(curl --fail --silent --show-error --max-time 20 "$base/top-unused-summary.js" || true)"
            css="$(curl --fail --silent --show-error --max-time 20 "$base/top-unused-summary.css" || true)"
            if grep -q '/top-unused-summary.css' <<<"$html" \
              && grep -q '未執行額が大きい注目6項目' <<<"$module" \
              && grep -q '中小河川整備費' <<<"$module" \
              && grep -q '高潮防御施設費' <<<"$module" \
              && grep -q '生活支援費' <<<"$module" \
              && grep -q '.top-unused-summary-list' <<<"$css"; then
              echo "Live deployment contains the six-item summary assets."
              exit 0
            fi
            sleep 5
          done
          echo "Live deployment did not expose the new summary assets."
          exit 1
